name: "CodeQL"
# PR-only + weekly by design: main is protected (no direct pushes), so every
# commit that reaches main already passed this exact scan against its PR
# head. Re-scanning on push to main would just repeat that work; the weekly
# schedule keeps the default-branch baseline fresh instead.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "bdd/go.mod"
      - "bdd/go.sum"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: '0 3 * * 5' # Weekly, Friday 03:00 UTC

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@67ba681cdcbc95ed0371c210ccf82c4d968ae5eb # v3.37.7
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          category: "/language:go"
