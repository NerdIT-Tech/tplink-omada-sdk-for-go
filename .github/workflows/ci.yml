name: CI
# PR-only by design: main is protected (no direct pushes), so every commit
# that reaches main already passed this exact suite against its PR head.
# Re-running on push to main would just repeat that work. release.yml is the
# only workflow that still needs a push-to-main trigger (release-please reads
# main's commit history to decide on releases).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "bdd/go.mod"
      - "bdd/go.sum"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
      - ".github/scripts/report-tests.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_FILE: coverage.out

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    outputs:
      code: ${{ steps.filter.outputs.any_changed }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Changed Files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        with:
          files: |
            **.go
            go.mod
            go.sum
            bdd/go.mod
            bdd/go.sum
            .golangci.yml
            .github/workflows/ci.yml
            .github/scripts/report-tests.sh

  check-go:
    name: Check Go Modules (${{ matrix.module }})
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [".", "bdd"]
        go-version: ["stable", "oldstable"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go mod download
      - run: go mod verify
      - run: |
          go mod tidy
          git diff --exit-code -- .

  build-go:
    name: Build (${{ matrix.module }}, ${{ matrix.os }}, ${{ matrix.go-version }})
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["stable", "oldstable"]
        module: [".", "bdd"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  lint-go:
    name: Lint (${{ matrix.module }})
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # Cold run (no golangci-lint/build cache — e.g. first run ever, or any run
    # where go.sum changed) type-checks ~5k Kiota-generated files under
    # openapi/+models/ and took 6m wall-clock / 12m CPU on a 16-core box; give
    # real headroom on weaker GitHub-hosted runners. Warm runs finish in seconds.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        module: [".", "bdd"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          skip-cache: false
          # ci.yml only ever runs on pull_request, so this always applies:
          # only issues on lines actually changed in the PR are reported.
          # Pre-existing findings across ~5k generated files under
          # openapi/+models/ (and any other legacy debt) stay out of the way
          # of unrelated PRs; .golangci.yml's exclusions.paths still fully
          # silences openapi/models even for their own changes, since that
          # code isn't hand-maintained.
          only-new-issues: true
          args: --timeout=20m

  test-go:
    name: Test
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"
          cache: true
      - name: Install tparse
        run: |
          go install github.com/mfridman/tparse@v0.18.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run Tests & Report
        run: .github/scripts/report-tests.sh
        id: test-run
      - name: Prepare Test Summary
        if: failure()
        id: create-summary
        run: |
          echo "SUMMARY<<EOF" >> $GITHUB_OUTPUT
          head -c 60000 test-summary.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Post Sticky Comment
        if: failure()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: test-failure-summary
          message: ${{ steps.create-summary.outputs.SUMMARY }}
      - name: Delete Test Failure Comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: test-failure-summary
          delete: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./${{ env.COVERAGE_FILE }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  govulncheck:
    name: Vulnerability Scan (${{ matrix.module }})
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [".", "bdd"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: stable
          go-package: ./...
          work-dir: ${{ matrix.module }}

  gosec:
    name: gosec SAST (${{ matrix.module }})
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        module: [".", "bdd"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"
          cache: true
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: Run gosec
        run: gosec -no-fail -fmt sarif -out ${{ github.workspace }}/gosec-${{ matrix.module == '.' && 'root' || matrix.module }}.sarif ./...
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@67ba681cdcbc95ed0371c210ccf82c4d968ae5eb # v3.37.7
        with:
          sarif_file: gosec-${{ matrix.module == '.' && 'root' || matrix.module }}.sarif
          category: gosec-${{ matrix.module == '.' && 'root' || matrix.module }}
